<!doctype html>
<meta charset="utf-8">
<title>Screenshot relay</title>
<script>
// Loaded inside App Store Connect to hand over the screenshots, which live on this origin.
(async () => {
  const files = [];
  for (let i = 1; i <= 5; i++) {
    const r = await fetch('shot-' + i + '.png');
    files.push(await r.arrayBuffer());
  }
  parent.postMessage({ kind: 'balance-shots', files }, 'https://appstoreconnect.apple.com', files);
})();
</script>
